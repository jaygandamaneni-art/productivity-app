<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== LOGIN / SIGN UP SCREEN ========== -->
  <main class="auth hidden" id="auth-view">
    <h1>Daily Quest</h1>
    <p class="tagline">Build habits. Earn XP. Level up.</p>

    <div class="card auth-card" id="auth-home">
      <button class="btn" id="go-signup">Sign up</button>
      <button class="btn secondary" id="go-login">Log in</button>
    </div>

    <form class="card auth-card hidden" id="signup-form">
      <h2>Create your account</h2>
      <input type="text" id="signup-username" placeholder="Choose a username" autocomplete="username" required>
      <input type="password" id="signup-password" placeholder="Password (6+ characters)" autocomplete="new-password" required>
      <input type="password" id="signup-confirm" placeholder="Confirm password" autocomplete="new-password" required>
      <p class="auth-error" id="signup-error"></p>
      <button type="submit" class="btn">Create account</button>
      <button type="button" class="link" data-back>Back</button>
    </form>

    <form class="card auth-card hidden" id="login-form">
      <h2>Welcome back</h2>
      <input type="text" id="login-username" placeholder="Username" autocomplete="username" required>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
      <p class="auth-error" id="login-error"></p>
      <button type="submit" class="btn">Log in</button>
      <button type="button" class="link" data-back>Back</button>
    </form>
  </main>

  <!-- ========== THE APP ========== -->
  <main class="app hidden" id="app-view">

    <header class="topbar">
      <div>
        <p class="date" id="today-date"></p>
        <h1>Daily Quest</h1>
      </div>
      <div class="topbar-right">
        <div class="streak">🔥 <span id="streak-count">0</span> day streak</div>
        <button class="link" id="logout-btn"><span id="user-label"></span> · Log out</button>
      </div>
    </header>

    <section class="card level-card">
      <div class="level-row">
        <span class="level" id="level-label">Level 1</span>
        <span class="xp-text" id="xp-text">0 / 100 XP</span>
      </div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="today">Today</button>
      <button class="tab" data-tab="habits">Habits</button>
    </nav>

    <!-- TODAY TAB -->
    <section id="tab-today">
      <div class="card">
        <h2>Today</h2>
        <form id="task-form" class="add-form">
          <input type="text" id="task-input" placeholder="Add a task for today" required>
          <button type="submit">Add</button>
        </form>
        <ul id="today-list" class="list"></ul>
      </div>
    </section>

    <!-- HABITS TAB -->
    <section id="tab-habits" class="hidden">
      <div class="card">
        <h2>My habits</h2>
        <p class="hint">Things you want to build. They show up in Today on their scheduled days.</p>
        <form id="habit-form" class="add-form">
          <input type="text" id="habit-input" placeholder="New habit (e.g. Wall passing)" required>
          <button type="submit">Add</button>
        </form>
        <ul id="habit-list" class="list"></ul>
      </div>
    </section>

  </main>

  <!-- ========== HABIT SCHEDULE POPUP ========== -->
  <div class="modal hidden" id="schedule-modal">
    <div class="modal-box card">
      <h2 id="modal-title">How often?</h2>

      <div class="freq-row">
        <button type="button" class="freq on" data-freq="daily">Daily</button>
        <button type="button" class="freq" data-freq="weekly">Weekly</button>
        <button type="button" class="freq" data-freq="monthly">Monthly</button>
      </div>

      <div id="weekly-pick" class="pick hidden">
        <p class="hint">Which days?</p>
        <div class="chips" id="weekday-chips"></div>
      </div>

      <div id="monthly-pick" class="pick hidden">
        <p class="hint">Which dates each month?</p>
        <div class="chips" id="date-chips"></div>
      </div>

      <p class="auth-error" id="modal-error"></p>
      <button type="button" class="btn" id="modal-save">Save habit</button>
      <button type="button" class="link" id="modal-cancel">Cancel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
